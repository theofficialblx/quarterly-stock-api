[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "quarterly-stock-api"
version = "1.0.0"
description = "Align stock prices and macroeconomic CSVs by calendar quarter."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
  "pandas>=2.2,<4",
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "build>=1.2,<2"]

[project.scripts]
quarterly-merge = "quarterly_stock_api.cli:main"
quarterly-api = "quarterly_stock_api.cli:serve"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
